[project]
name = "modernesoftwarentwicklungws26"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "JJ Omin", email = "leonhard.tilly@stud.hs-emden-leer.de" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
modernesoftwarentwicklungws26 = "modernesoftwarentwicklungws26:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --cov=modernesoftwarentwicklungws26 --cov-report=term-missing --cov-report=xml"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true  # zwei test_value_objects.py, wie A12 bei pytest
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
# Die Tests vergleichen absichtlich verschiedene ID-Typen, z. B. PersonId(u) != AbstimmungId(u).
disable_error_code = ["comparison-overlap"]

# Abhängigkeitsregeln aus Übung 3, Kap. 3 und 6. Ein neuer Context (abstimmung, auswertung)
# wird hier eingetragen, sobald sein Package existiert; fehlende Module lehnt import-linter ab.
[tool.importlinter]
root_package = "modernesoftwarentwicklungws26"

[[tool.importlinter.contracts]]
name = "Bounded Contexts importieren einander nicht, nur shared"
type = "independence"
modules = [
    "modernesoftwarentwicklungws26.identity",
    "modernesoftwarentwicklungws26.stimmabgabe",
]

[[tool.importlinter.contracts]]
name = "shared kennt keinen Bounded Context"
type = "forbidden"
source_modules = ["modernesoftwarentwicklungws26.shared"]
forbidden_modules = [
    "modernesoftwarentwicklungws26.identity",
    "modernesoftwarentwicklungws26.stimmabgabe",
]

[[tool.importlinter.contracts]]
name = "Die Domäne kennt weder application noch infrastructure"
type = "layers"
containers = [
    "modernesoftwarentwicklungws26.identity",
    "modernesoftwarentwicklungws26.stimmabgabe",
]
layers = ["(infrastructure) | (application)", "domain"]

[[tool.importlinter.contracts]]
name = "Aggregates kennen weder Repositories noch Services"
type = "layers"
containers = [
    "modernesoftwarentwicklungws26.identity.domain",
    "modernesoftwarentwicklungws26.stimmabgabe.domain",
]
layers = ["(service)", "(repository)", "model"]
